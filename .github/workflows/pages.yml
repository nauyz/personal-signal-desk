name: Collect and publish signal desk
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [master, main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: signal-desk-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache/restore@v4
        with:
          path: data/personal_sources.db
          key: signal-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: signal-data-
      - name: Test
        run: |
          python -m unittest discover -s tests -q
          node tests/prefetch.cjs
      - name: Restore durable public facts archive
        shell: bash
        run: |
          set -euo pipefail
          archive_ref=$(git ls-remote --heads origin refs/heads/facts-archive)
          if [ -n "$archive_ref" ]; then
            git fetch origin facts-archive
            git worktree add .fact-archive FETCH_HEAD
            git -C .fact-archive switch -c facts-archive
          else
            mkdir .fact-archive
            git -C .fact-archive init -b facts-archive
            git -C .fact-archive remote add origin "$(git remote get-url origin)"
          fi
          python fact_archive.py restore .fact-archive
      - name: Refresh public source snapshots and export
        env:
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python cloud_build.py --collect
      - name: Persist facts independently of the cache
        shell: bash
        run: |
          set -euo pipefail
          python fact_archive.py save .fact-archive
          git -C .fact-archive config user.name 'github-actions[bot]'
          git -C .fact-archive config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .fact-archive add -- '*.json'
          if ! git -C .fact-archive diff --cached --quiet; then
            git -C .fact-archive commit -m 'archive: preserve collected public facts'
            auth=$(git config --get http.https://github.com/.extraheader)
            git -C .fact-archive -c http.https://github.com/.extraheader= -c "http.https://github.com/.extraheader=$auth" push origin HEAD:refs/heads/facts-archive
          fi
      - uses: actions/cache/save@v4
        with:
          path: data/personal_sources.db
          key: signal-data-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser regression gate
        run: npm run test:browser
      - name: Save browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression
          path: test-artifacts/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
